[pytest]
# Pytest configuration for Randol's Backend

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Test file patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Verbose output
addopts = 
    -v
    --strict-markers
    --tb=short
    -ra
    --color=yes

# Async mode
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (skip with -m "not slow")
    api: API endpoint tests
    agent: Agent tests
    database: Database tests

# Coverage settings (when running with --cov)
# Run with: pytest --cov=. --cov-report=html

# Ignore patterns
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    venv

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout (in seconds)
timeout = 60

# Environment variables for tests
env =
    TESTING=true
    FLASK_ENV=testing
    MOCK_MODE=true
