# Railway Configuration for Randol's Marketing Platform

[build]
builder = "nixpacks"

[deploy]
numReplicas = 1
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Backend Service
[[services]]
name = "api"
rootDirectory = "backend"

[services.build]
buildCommand = "pip install -r requirements.txt && python -c \"import nltk; nltk.download('punkt'); nltk.download('averaged_perceptron_tagger')\""

[services.deploy]
startCommand = "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT api.app:app"
healthcheckPath = "/api/v1/health"

# Frontend Service
[[services]]
name = "dashboard"
rootDirectory = "frontend"

[services.build]
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npm start"
